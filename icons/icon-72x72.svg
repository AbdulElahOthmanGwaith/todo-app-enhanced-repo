      <path d="M3 6L5.5 8.5L9 4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  
  <!-- نص "مهامي" -->
  <text x="36" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">مهامي</text>
